<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#b85c38">
<title>Smiley Family · Arizona Christmas 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌵</text></svg>">
<style>
:root{
  --sand:#f7f1e7; --card:#fffdf9; --ink:#2b2522; --muted:#6f625a; --line:#e8dccb;
  --terra:#b85c38; --terra-d:#8f4327; --sage:#51705a; --sage-l:#e3ece4; --dusk:#3c4a63;
  --amber:#9a6200; --amber-bg:#fff1d6; --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--sand);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--terra-d)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 90px}
header.hero{background:linear-gradient(160deg,#c9693f 0%,#b85c38 45%,#7f4a5a 100%);color:#fff;padding:22px 18px 50px;position:relative;overflow:hidden}
header.hero h1{margin:0 auto;max-width:720px;font-size:1.65rem;line-height:1.2;letter-spacing:-.01em}
header.hero p{margin:6px auto 0;max-width:720px;opacity:.95}
header.hero svg{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:60px}
nav.tabs{position:sticky;top:0;z-index:20;background:rgba(247,241,231,.96);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav.tabs .in{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;max-width:720px;margin:0 auto;scrollbar-width:none}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;min-height:44px;display:flex;align-items:center;padding:0 14px;border-radius:22px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;font-size:.95rem}
nav.tabs a:active{background:var(--sage-l)}
.banner{margin:14px 0;position:relative;background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:0 4px 18px rgba(80,50,30,.12);font-size:.93rem;color:var(--muted)}
.banner b{color:var(--ink)}
.whoami{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
section{margin:22px 0}
h2{font-size:1.3rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h3{font-size:1.05rem;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.muted{color:var(--muted);font-size:.93rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.pending{background:var(--amber-bg);color:var(--amber);border:1px solid #f0d49b}
.booked{background:var(--sage-l);color:var(--sage)}
.soft{background:#f1e6d8;color:var(--terra-d)}
dl.ov{display:grid;grid-template-columns:1fr;gap:10px;margin:0}
dl.ov dt{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
dl.ov dd{margin:0}
table.budget{width:100%;border-collapse:collapse;font-size:.93rem}
table.budget td{padding:9px 4px;border-top:1px solid var(--line);vertical-align:top}
details.pkg{margin:8px 0;background:#faf6ef;border-radius:10px;padding:8px 10px}details.pkg summary{cursor:pointer}
table.budget td.amt{text-align:right;font-weight:700;white-space:nowrap;padding-left:8px}
details.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
details.day>summary{list-style:none;cursor:pointer;padding:14px 48px 14px 14px;min-height:60px;position:relative}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary::after{content:"";position:absolute;right:18px;top:24px;width:10px;height:10px;border-right:3px solid var(--terra);border-bottom:3px solid var(--terra);transform:rotate(45deg);transition:transform .2s}
details.day[open]>summary::after{transform:rotate(-135deg);top:28px}
.date{font-size:.8rem;font-weight:800;color:var(--terra);text-transform:uppercase;letter-spacing:.06em}
.sumtitle{font-weight:700;font-size:1.05rem;line-height:1.3;margin-top:2px}
.cc{font-size:.8rem;color:var(--muted);margin-top:4px}
.daybody{padding:0 14px 14px}
.item{border-left:3px solid var(--line);padding:4px 0 10px 12px;margin-left:4px}
.item .t{font-size:.78rem;font-weight:700;color:var(--sage);text-transform:uppercase;letter-spacing:.05em}
.item p{margin:2px 0 6px}
.closed{background:#f6ece9;border-radius:12px;padding:10px 12px;font-size:.92rem;color:#7a3b2a}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:.92rem;font-weight:600;text-decoration:none;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.voted{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.small{min-height:40px;padding:0 12px;font-size:.88rem}
.opt{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:#fff}
.opt .price{font-weight:700}
.votes{font-size:.85rem;color:var(--sage);margin-top:4px}
ul.clean{margin:6px 0;padding-left:20px}
.check{display:flex;align-items:center;gap:12px;min-height:46px;padding:4px 2px;border-top:1px solid var(--line);cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--sage);flex:0 0 auto}
.check.done span{text-decoration:line-through;color:var(--muted)}
.kd{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.kd .d{flex:0 0 92px;font-weight:800;color:var(--terra);font-size:.9rem}
/* comments */
.thread{margin-top:12px;background:#faf5ee;border-radius:14px;padding:10px 12px}
.thread h4{margin:0 0 6px;font-size:.9rem;color:var(--dusk)}
.cmt{padding:8px 0;border-top:1px solid var(--line)}
.cmt:first-of-type{border-top:0}
.cmt .who{font-weight:700;font-size:.9rem}
.cmt .when{color:var(--muted);font-size:.78rem;margin-left:6px}
.cmt .txt{white-space:pre-wrap;word-wrap:break-word;margin-top:2px}
.cmt .del{background:none;border:0;color:var(--muted);font-size:.8rem;text-decoration:underline;padding:6px 0;min-height:32px;cursor:pointer}
.compose{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.compose textarea{flex:1;min-height:46px;max-height:160px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;background:#fff}
.avatar{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:.75rem;font-weight:800;margin-right:6px;vertical-align:middle}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(30,20,15,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sheet input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--dusk);color:#fff;padding:10px 16px;border-radius:12px;font-size:.92rem;display:none;z-index:60;max-width:90vw}
.demo{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:6px 10px;font-size:.82rem;margin-top:8px}
footer{font-size:.85rem;color:var(--muted)}
@media (min-width:600px){dl.ov{grid-template-columns:1fr 1fr} header.hero h1{font-size:2rem}}
</style>
</head>
<body>
<header class="hero">
  <h1 id="h-title"></h1>
  <p id="h-sub"></p>
  <svg viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 40 L40 28 L70 36 L110 18 L150 34 L190 22 L230 38 L270 20 L310 32 L350 24 L400 36 L400 60 L0 60Z" fill="#f7f1e7" opacity=".35"/>
    <path d="M0 50 L50 42 L90 48 L140 38 L200 50 L250 40 L300 48 L360 42 L400 48 L400 60 L0 60Z" fill="#f7f1e7"/>
    <g fill="#51705a"><rect x="318" y="14" width="7" height="40" rx="3.5"/><rect x="308" y="26" width="5" height="14" rx="2.5"/><rect x="308" y="36" width="12" height="5" rx="2.5"/><rect x="330" y="20" width="5" height="14" rx="2.5"/><rect x="323" y="30" width="12" height="5" rx="2.5"/></g>
  </svg>
</header>
<nav class="tabs"><div class="in">
  <a href="#overview">Overview</a><a href="#days">Day by day</a><a href="#flights">Flights</a><a href="#lodging">Where we stay</a><a href="#packing">Packing</a><a href="#dates">Key dates</a>
</div></nav>
<main class="wrap">
  <div class="banner">
    <div id="checked"></div>
    <div class="whoami"><span id="whoami-label">Commenting as: <b>—</b></span><button class="btn small" id="change-name">Set my name</button></div>
    <div id="demo-note" class="demo" hidden>Demo mode: comments are saved on this phone only until the shared comment backend is connected.</div>
  </div>
  <section id="overview"></section>
  <section id="days"></section>
  <section id="flights"></section>
  <section id="lodging"></section>
  <section id="packing"></section>
  <section id="dates"></section>
  <section id="sources"></section>
</main>

<div class="sheet-bg" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
  <div class="sheet">
    <h3 id="sheet-h">Who's commenting?</h3>
    <div class="muted">Tap your name or type it. It's saved on this phone.</div>
    <div class="chips" id="name-chips"></div>
    <input id="name-input" placeholder="Type your name" autocomplete="given-name" maxlength="30">
    <div class="btnrow" style="margin-top:12px"><button class="btn primary" id="name-save">Save</button><button class="btn" id="name-cancel">Cancel</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="trip-data.js"></script>
<script>
/* ================= Comments layer (pluggable) ================= */
const CommentBackends = {
  local(){
    const KEY='tripComments.v1';
    const read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
    return {
      shared:false,
      async list(){return read()},
      async add(c){const a=read();a.push(c);localStorage.setItem(KEY,JSON.stringify(a));return c},
      async remove(id){localStorage.setItem(KEY,JSON.stringify(read().filter(c=>c.id!==id)))}
    };
  },
  /* Google Apps Script web app (or any server with the same API):
     GET  url?action=list            -> {ok:true, comments:[...]}
     POST url  body(text/plain JSON) {action:"add", comment} | {action:"delete", id, name}
     text/plain avoids a CORS preflight, which Apps Script can't answer. */
  appsscript(cfg){
    const url=cfg.url;
    const post=async body=>{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});
      const j=await r.json(); if(!j.ok) throw new Error(j.error||'Save failed'); return j;
    };
    return {
      shared:true,
      async list(){const r=await fetch(url+(url.includes('?')?'&':'?')+'action=list&t='+Date.now(),{redirect:'follow'});const j=await r.json();if(!j.ok)throw new Error(j.error||'Load failed');return j.comments||[]},
      async add(c){return (await post({action:'add',comment:c})).comment||c},
      async remove(id,name){await post({action:'delete',id,name})}
    };
  }
};
CommentBackends.rest=CommentBackends.appsscript;

const cfg=window.COMMENTS_CONFIG||{type:'local'};
const backend=(cfg.type!=='local'&&cfg.url)?CommentBackends[cfg.type](cfg):CommentBackends.local();
let COMMENTS=[];

/* ================= helpers ================= */
const T=window.TRIP;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const maps=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const tag=st=>st==='pending'?'<span class="tag pending">Pending</span>':st==='booked'?'<span class="tag booked">Booked</span>':'';
const getName=()=>localStorage.getItem('tripName')||'';
const colors=['#b85c38','#51705a','#3c4a63','#8a5a9e','#c28a1e','#2f7f86','#a8475e','#5b6b2f'];
const colorFor=n=>{let h=0;for(const ch of n.toLowerCase())h=(h*31+ch.charCodeAt(0))>>>0;return colors[h%colors.length]};
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}
function ago(ts){const d=(Date.now()-ts)/1000;if(d<60)return'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
const thread=(id,label)=>`<div class="thread" data-section="${id}"><h4>💬 Comments${label?' on '+esc(label):''}</h4><div class="list"></div>
  <form class="compose" data-section="${id}"><textarea placeholder="Add a comment…" rows="1" maxlength="1000" aria-label="Comment"></textarea><button class="btn primary" type="submit">Post</button></form></div>`;
const voteBtn=(section,opt,label)=>`<button class="btn small votebtn" data-section="${section}" data-opt="${opt}" data-label="${esc(label)}">👍 Vote</button><div class="votes" data-votes="${section}|${opt}"></div>`;

const usd=n=>'$'+Math.round(n).toLocaleString('en-US');
const pkgTable=(L,op)=>{const tot=L.pkgCommon.reduce((a,r)=>a+r[1],op.pkgHome);return `<details class="pkg"><summary><b>Package total ${usd(tot)}</b> · ${usd(8000-tot)} under budget</summary>
  <table class="budget"><tr><td>Tucson home, 4 nights</td><td class="amt">${usd(op.pkgHome)}</td></tr>${L.pkgCommon.map(r=>`<tr><td>${esc(r[0])}${r[2]?`<div class="muted">${esc(r[2])}</div>`:''}</td><td class="amt">${usd(r[1])}</td></tr>`).join('')}
  <tr><td><b>Total</b></td><td class="amt">${usd(tot)}</td></tr><tr><td>Room under $8,000</td><td class="amt">${usd(8000-tot)}</td></tr></table><div class="muted">${L.pkgNote||''}</div></details>`};
/* ================= render ================= */
function render(){
  document.title=T.title;
  $('#h-title').textContent=T.title; $('#h-sub').textContent=T.subtitle;
  $('#checked').innerHTML='⚠️ <b>'+esc(T.checked)+'</b>';
  const o=T.overview;
  $('#overview').innerHTML=`<h2>🗺️ Overview</h2>
   <div class="card"><dl class="ov">
    <div><dt>Dates</dt><dd>${o.dates}</dd></div><div><dt>Who</dt><dd>${esc(T.who)}</dd></div>
    <div style="grid-column:1/-1"><dt>Route</dt><dd>${o.route}</dd></div>
    <div><dt>Must-haves</dt><dd>${o.rule}</dd></div>
    <div><dt>Weather</dt><dd>${o.weather} <a href="${o.weatherSrc}" target="_blank" rel="noopener">NWS</a></dd></div>
   </dl></div>
   <div class="card"><h3>Budget snapshot</h3><div class="muted">Only sourced numbers. Package totals for each home are under Where we stay.</div>
    <table class="budget">${o.budget.map(b=>`<tr><td>${esc(b.item)} ${tag(b.status)}${b.note?`<div class="muted">${esc(b.note)}</div>`:''}</td><td class="amt">${esc(b.amount)}</td></tr>`).join('')}</table>
    ${thread('overview')}</div>`;

  $('#days').innerHTML='<h2>📅 Day by day</h2><div class="muted">Tap a day to open it.</div>'+T.days.map((d,di)=>`
   <details class="day" id="${d.id}" ${di===0?'open':''}><summary>
     <div class="date">${esc(d.date)} ${tag(d.status)}</div><div class="sumtitle">${esc(d.title)}</div><div class="cc" data-count="${d.id}"></div></summary>
    <div class="daybody"><p class="muted" style="margin-top:0">${d.summary||''}</p>
     ${d.items.map((it,ii)=>{const isOpt=/^Option/.test(it.time||'');const oid=d.id+'-opt-'+ii;return `<div class="item">
       ${it.time?`<div class="t">${esc(it.time)}</div>`:''}<h3>${esc(it.title)} ${tag(it.status)}</h3>
       ${it.text?`<p>${it.text}</p>`:''}
       <div class="btnrow">${it.map?`<a class="btn small" href="${maps(it.map)}" target="_blank" rel="noopener">📍 Map</a>`:''}${it.src?`<a class="btn small" href="${it.src}" target="_blank" rel="noopener">🔗 Source</a>`:''}${isOpt?voteBtn(d.id,oid,it.title):''}</div>
     </div>`}).join('')}
     ${d.closed?`<div class="closed">🚫 ${esc(d.closed)}</div>`:''}
     ${thread(d.id,d.date)}</div></details>`).join('');

  const f=T.flights;
  $('#flights').innerHTML=`<h2>✈️ Flights <span class="tag pending">Pending</span></h2><div class="muted">${f.note}</div>`+
   f.groups.map(g=>`<div class="card"><h3>${esc(g.title)} ${tag(g.status)}</h3>
     ${g.options.length?'':`<p class="muted">${esc(g.empty||'')}</p>`}
     ${g.options.map(op=>`<div class="opt"><div><b>${esc(op.label)}</b></div><div><span class="price">${esc(op.price)}</span> per person · <span class="muted">≈ ${esc(op.six)} for 6</span></div>
        ${g.vote?`<div class="btnrow">${voteBtn('flights',op.id,op.label)}</div>`:''}</div>`).join('')}
     ${g.link?`<a class="btn small" href="${g.link}" target="_blank" rel="noopener">🔗 Google Flights search</a>`:''}</div>`).join('')+
   `<div class="card"><ul class="clean">${f.caveats.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>${thread('flights','flights')}</div>`;

  const L=T.lodging;
  $('#lodging').innerHTML=`<h2>🏡 Where we stay <span class="tag pending">Pending</span></h2>
   <h3>Tucson · Dec 24–28 (4 nights), pick one</h3><div class="muted">${L.note}</div>`+
   L.options.map(op=>`<div class="card"><span class="tag soft">${esc(op.tag)}</span> ${tag(op.status)}<h3 style="margin-top:6px">${esc(op.name)}</h3>
     <p style="margin:4px 0">💲 ${op.price}</p><p style="margin:4px 0">🛏️ ${op.beds}</p>${op.cancel?`<p style="margin:4px 0">📅 ${op.cancel}</p>`:''}${op.pkgHome?pkgTable(L,op):''}<p style="margin:4px 0">👍 ${op.pros}</p><p style="margin:4px 0">⚠️ ${op.cons}</p>
     <div class="btnrow"><a class="btn small" href="${maps(op.map)}" target="_blank" rel="noopener">📍 Map</a><a class="btn small" href="${op.link}" target="_blank" rel="noopener">🔗 Website</a>${voteBtn('lodging',op.id,op.name)}</div></div>`).join('')+
   `<div class="card"><h3>Scottsdale · night of Dec 28 <span class="tag pending">Pending</span></h3><div class="muted">${L.scottsdale.note}</div>
     ${L.scottsdale.options.map(s=>`<div class="opt"><b>${esc(s.name)}</b><div class="muted">${esc(s.price)}</div><div class="btnrow"><a class="btn small" href="${maps(s.map)}" target="_blank" rel="noopener">📍 Map</a></div></div>`).join('')}
     ${thread('lodging','where we stay')}</div>`;

  const done=JSON.parse(localStorage.getItem('tripPacked')||'{}');
  $('#packing').innerHTML=`<h2>🎒 Packing list</h2><div class="muted">Checkmarks save on your own phone.</div>`+
   T.packing.map((g,gi)=>`<div class="card"><h3>${esc(g.group)}</h3>${g.items.map((it,ii)=>{const k=gi+'-'+ii;return `<label class="check ${done[k]?'done':''}"><input type="checkbox" data-k="${k}" ${done[k]?'checked':''}><span>${esc(it)}</span></label>`}).join('')}</div>`).join('')+
   `<div class="card">${thread('packing','packing')}</div>`;

  $('#dates').innerHTML=`<h2>⏰ Key dates & reminders</h2><div class="card">`+
   T.keyDates.map(k=>`<div class="kd"><div class="d">${esc(k.date)}</div><div><b>${esc(k.title)}</b> ${tag(k.status)}${k.text?`<div class="muted">${esc(k.text)}</div>`:''}${k.link?`<div><a href="${k.link}" target="_blank" rel="noopener">${k.link.startsWith('tel:')?'Call':'Link'}</a></div>`:''}</div></div>`).join('')+
   thread('dates','key dates')+`</div>`;

  $('#sources').innerHTML=`<h2>🔗 Sources</h2><div class="card"><div class="muted">${esc(T.checked)}</div><ul class="clean">${T.sources.map(([n,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${esc(n)}</a></li>`).join('')}</ul></div>
   <footer>Built for the Smiley family. Edit <code>trip-data.js</code> to update.</footer>`;
}

function renderComments(){
  const bySec={};for(const c of COMMENTS){(bySec[c.section]=bySec[c.section]||[]).push(c)}
  const me=getName().toLowerCase();
  document.querySelectorAll('.thread').forEach(th=>{
    const list=(bySec[th.dataset.section]||[]).filter(c=>c.text).sort((a,b)=>a.ts-b.ts);
    th.querySelector('.list').innerHTML=list.length?list.map(c=>`<div class="cmt"><span class="avatar" style="background:${colorFor(c.name)}">${esc(c.name[0]||'?').toUpperCase()}</span><span class="who">${esc(c.name)}</span><span class="when">${ago(c.ts)}</span>
      <div class="txt">${esc(c.text)}</div>${c.name.toLowerCase()===me?`<button class="del" data-id="${esc(c.id)}">Delete</button>`:''}</div>`).join(''):'<div class="muted">No comments yet. Be the first!</div>';
  });
  document.querySelectorAll('[data-count]').forEach(el=>{const n=(bySec[el.dataset.count]||[]).filter(c=>c.text).length;el.textContent=n?`💬 ${n} comment${n>1?'s':''}`:''});
  // votes: latest vote per person per section wins
  const tallies={};const mine={};
  const sorted=[...COMMENTS].filter(c=>c.vote).sort((a,b)=>a.ts-b.ts);const latest={};
  for(const c of sorted) latest[c.section+'|'+c.name.toLowerCase()]=c;
  for(const c of Object.values(latest)){if(c.vote==='none')continue;const k=c.section+'|'+c.vote;(tallies[k]=tallies[k]||[]).push(c.name);if(c.name.toLowerCase()===me)mine[k]=1}
  document.querySelectorAll('[data-votes]').forEach(el=>{const v=tallies[el.dataset.votes]||[];el.textContent=v.length?`👍 ${v.length}: ${v.join(', ')}`:''});
  document.querySelectorAll('.votebtn').forEach(b=>{const on=mine[b.dataset.section+'|'+b.dataset.opt];b.classList.toggle('voted',!!on);b.textContent=on?'✓ My pick':'👍 Vote'});
}

async function refresh(){try{COMMENTS=await backend.list();renderComments()}catch(e){console.warn(e)}}

/* ================= name ================= */
let pendingAction=null;
function openSheet(after){pendingAction=after||null;$('#name-chips').innerHTML=(T.family||[]).map(n=>`<button class="btn" data-name="${esc(n)}">${esc(n)}</button>`).join('');$('#name-input').value=getName();$('#sheet').classList.add('show')}
function closeSheet(){$('#sheet').classList.remove('show')}
function setName(n){n=n.trim().slice(0,30);if(!n)return;localStorage.setItem('tripName',n);updateWho();closeSheet();renderComments();if(pendingAction){const a=pendingAction;pendingAction=null;a()}}
function updateWho(){const n=getName();$('#whoami-label').innerHTML='Commenting as: <b>'+(n?esc(n):'not set')+'</b>';$('#change-name').textContent=n?'Change':'Set my name'}
function needName(fn){if(getName())fn();else openSheet(fn)}

/* ================= events ================= */
document.addEventListener('submit',e=>{
  const f=e.target.closest('form.compose');if(!f)return;e.preventDefault();
  const ta=f.querySelector('textarea');const text=ta.value.trim();if(!text)return;
  needName(async()=>{
    const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),section:f.dataset.section,name:getName(),text,ts:Date.now()};
    const btn=f.querySelector('button');btn.disabled=true;
    try{await backend.add(c);ta.value='';COMMENTS.push(c);renderComments();toast('Comment posted');refresh()}catch(err){toast('Could not post. Check your connection and try again.')}
    btn.disabled=false;
  });
});
document.addEventListener('click',e=>{
  const v=e.target.closest('.votebtn');
  if(v){needName(async()=>{
    const already=v.classList.contains('voted');
    const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),section:v.dataset.section,name:getName(),vote:already?'none':v.dataset.opt,text:'',ts:Date.now()};
    try{await backend.add(c);COMMENTS.push(c);renderComments();toast(already?'Vote removed':'Voted for '+v.dataset.label)}catch(err){toast('Could not save vote.')}
  });return}
  const d=e.target.closest('.del');
  if(d){if(!confirm('Delete this comment?'))return;backend.remove(d.dataset.id,getName()).then(()=>{COMMENTS=COMMENTS.filter(c=>c.id!==d.dataset.id);renderComments()}).catch(()=>toast('Could not delete.'));return}
  const chip=e.target.closest('[data-name]');if(chip){setName(chip.dataset.name);return}
  if(e.target.id==='sheet')closeSheet();
});
$('#change-name').onclick=()=>openSheet();
$('#name-save').onclick=()=>setName($('#name-input').value);
$('#name-cancel').onclick=()=>{pendingAction=null;closeSheet()};
$('#name-input').addEventListener('keydown',e=>{if(e.key==='Enter')setName(e.target.value)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k===undefined)return;const d=JSON.parse(localStorage.getItem('tripPacked')||'{}');d[k]=e.target.checked;localStorage.setItem('tripPacked',JSON.stringify(d));e.target.closest('.check').classList.toggle('done',e.target.checked)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});

render();updateWho();$('#demo-note').hidden=backend.shared;refresh();
if(backend.shared)setInterval(()=>{if(!document.hidden)refresh()},30000);
</script>
</body>
</html>
